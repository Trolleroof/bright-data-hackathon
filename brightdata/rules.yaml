# Bright Data settings for Bidex.
# The camera does not classify objects and cannot see mass. This file tells
# the discovery pipeline what to search for and what a usable result looks like.
#
# Flow: search(query) -> candidate URLs -> fetch(url) via Web Unlocker -> extract(html).
# No collector id, no CSS selectors — pages are read, not hand-wired.

# Query template used when the camera/Lens step only has a rough label, not a name.
search_query_template: "{label} product dimensions"

# Last-resort URL if search returns nothing usable. Not the primary path —
# if this is what fires on stage, say so on the HUD, do not hide it.
fallback_catalog_url: https://www.ikea.com/us/en/p/ikea-365-water-bottle-dark-gray-20480013/

# Fields the factory requires to ship a geom. `extract()` returns what it
# finds; anything missing here falls back to the fixture value for that field.
required_fields:
  - name
  - height_cm
  - width_cm

# Optional physics fields — feed density/friction, not required to ship a geom.
physics_fields:
  - weight_g
  - material

material_density_kg_m3:
  glass: 2500
  stainless_steel: 8000
  aluminum: 2700
  plastic: 950
  ceramic: 2300
  cardboard: 700
  rubber: 1200
  wood: 600

# --- 3D geometry (issue #19) -------------------------------------------------
# The camera measures size but cannot see shape; the scrape reads size and mass
# but cannot draw. This block tells the mesh ladder where to look for shape.
# Rung 1 is the product's own AR model (the exact object), rung 2 is the wider
# 3D-asset web, rung 3 is the primitive cylinder we already ship.
mesh:
  # Hard caps so a stray 400 MB scan cannot stall the demo.
  max_bytes: 33554432
  max_pages_per_source: 2
  collision_faces: 400
  extensions: [".stl", ".glb", ".gltf", ".obj", ".ply", ".usdz"]

  # Rung 2. One SERP query per source: discovery across many sources at once is
  # the point — a single curated dataset would not need search at all.
  sources:
    - name: thingiverse
      query: "site:thingiverse.com {label} stl"
      host: thingiverse.com
    - name: printables
      query: "site:printables.com {label} stl download"
      host: printables.com
    - name: sketchfab
      query: "site:sketchfab.com {label} 3d model download"
      host: sketchfab.com
    - name: open_web
      query: "{label} 3d model stl free download"
      host: ""
