# Bright Data settings for Bidex.
# The camera does not classify objects and cannot see mass. This file tells
# the discovery pipeline what to search for and what a usable result looks like.
#
# Flow: search(query) -> candidate URLs -> fetch(url) via Web Unlocker -> extract(html).
# No collector id, no CSS selectors — pages are read, not hand-wired.

# Query template used when the camera/Lens step only has a rough label, not a name.
search_query_template: "{label} product dimensions"

# Last-resort URL if search returns nothing usable. Not the primary path —
# if this is what fires on stage, say so on the HUD, do not hide it.
fallback_catalog_url: https://www.ikea.com/us/en/p/ikea-365-water-bottle-dark-gray-20480013/

# Fields the factory requires to ship a geom. `extract()` returns what it
# finds; anything missing here falls back to the fixture value for that field.
required_fields:
  - name
  - height_cm
  - width_cm

# Optional physics fields — feed density/friction, not required to ship a geom.
physics_fields:
  - weight_g
  - material

material_density_kg_m3:
  glass: 2500
  stainless_steel: 8000
  aluminum: 2700
  plastic: 950
  ceramic: 2300
  cardboard: 700
  rubber: 1200
  wood: 600

# --- 3D geometry (issue #19) -------------------------------------------------
# The camera measures size but cannot see shape; the scrape reads size and mass
# but cannot draw. This block tells the mesh ladder where to look for shape.
# Rung 1 is the product's own AR model (the exact object), rung 2 is the wider
# 3D-asset web, rung 3 is the primitive cylinder we already ship.
mesh:
  # Hard caps so a stray 400 MB scan cannot stall the demo.
  max_bytes: 33554432
  max_pages_per_source: 2
  # Hard ceiling on documents fetched per import. Each Web Unlocker fetch is
  # seconds, and an operator is watching a spinner while they run.
  max_fetches: 6
  collision_faces: 400
  extensions: [".stl", ".glb", ".gltf", ".obj", ".ply", ".usdz"]

  # Rung 2. One SERP query per source: discovery across many sources at once is
  # the point — a single curated dataset would not need search at all.
  #
  # MuJoCo's own asset ecosystem comes first: those meshes are already authored
  # for a physics engine (right units, watertight, sane face counts), so they
  # need the least repair in mesh_fit. The general 3D-print/asset web follows as
  # the broad net for objects no robotics dataset happens to carry.
  sources:
    - name: mujoco_menagerie
      query: "site:github.com google-deepmind mujoco_menagerie {label} mesh stl obj"
      host: github.com
    - name: mujoco_scanned_objects
      query: "site:github.com mujoco_scanned_objects {label} obj"
      host: github.com
    - name: mujoco_docs
      query: "site:mujoco.readthedocs.io OR site:mujoco.org {label} model asset"
      host: ""
    - name: thingiverse
      query: "site:thingiverse.com {label} stl"
      host: thingiverse.com
    - name: printables
      query: "site:printables.com {label} stl download"
      host: printables.com
    - name: sketchfab
      query: "site:sketchfab.com {label} 3d model download"
      host: sketchfab.com
    - name: open_web
      query: "{label} 3d model stl free download"
      host: ""

# --- MuJoCo text search (replaces the mesh download) -------------------------
# The old path downloaded binary meshes and fitted them. This one never
# downloads geometry: it searches MuJoCo's own model ecosystem for an object
# *similar* to what the camera saw, reads the MJCF/README **text**, and hands
# that text to the agent, which reasons its way to a sized primitive. Text is
# the whole payload — no .stl, no trimesh, no decimation.
mjcf:
  # Plain-text things worth reading. GitHub blob URLs are rewritten to raw.
  extensions: [".xml", ".mjcf", ".md", ".txt"]
  max_pages_per_source: 2
  # Hard ceiling on documents fetched per import. Each Web Unlocker fetch is
  # seconds, and an operator is watching a spinner while they run.
  max_fetches: 6
  # Anything longer is truncated before it reaches the agent; MJCF bodies of
  # interest sit near the top of a model file.
  max_chars_per_doc: 12000

  # Colour words the detector prepends are dropped before searching: "gray"
  # narrows a MuJoCo query to nothing, because model files are not catalogued
  # by colour. The agent still sees the full label.
  drop_words: [gray, grey, red, orange, yellow, green, cyan, blue, purple, white, black, dark, light]

  # MuJoCo first, and only MuJoCo: the point of this path is that the geometry
  # vocabulary we copy from is already physics-authored (metres, densities,
  # sane primitives), so the agent is translating, not inventing.
  #
  # Query shapes are chosen for what SERP actually returns: a bare `site:`
  # filter plus a repo name yields zero results, while naming the repo as a
  # keyword surfaces the blob URLs that hold real MJCF.
  sources:
    - name: mujoco_scanned_objects
      query: "mujoco_scanned_objects {label} model.xml github"
      host: ""
    - name: mujoco_mjcf
      query: "mujoco mjcf {label} xml geom body"
      host: ""
    - name: mujoco_menagerie
      query: "mujoco_menagerie {label} xml model github"
      host: ""
    - name: mujoco_github
      query: "github mujoco {label} model.xml worldbody"
      host: ""
    - name: mujoco_docs
      query: "site:mujoco.readthedocs.io {label} geom size density body"
      host: mujoco.readthedocs.io
